<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yong Zhang · 张勇</title>
<meta name="description" content="Yong Zhang (张勇) — Staff Engineer at Trend Micro. AI agent engineering, micro-frontends, front-end architecture.">
<style>
@property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

:root {
  --bg: #05060f; --bg-2: #0a0c1d; --fg: #e8ebf7; --muted: #8a92b2; --dim: #5b6386;
  --c1: #22d3ee; --c2: #a78bfa; --c3: #f472b6; --c4: #34d399;
  --glass: rgba(255,255,255,.035); --glass-2: rgba(255,255,255,.06); --line: rgba(255,255,255,.08);
  --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --radius: 18px; --max: 1160px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; overflow-x: clip; }
body {
  margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden;
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased;
}
html[lang=zh] body { font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, "Microsoft YaHei", sans-serif; }
a { color: inherit; text-decoration: none; }
strong { color: #fff; font-weight: 600; }
::selection { background: rgba(167,139,250,.35); }

/* ---------- Background: aurora + grid ---------- */
.bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: radial-gradient(ellipse at 50% -10%, #12163a 0%, var(--bg) 60%); }
.blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .32; mix-blend-mode: screen; will-change: transform; }
.blob.b1 { background: radial-gradient(circle, var(--c1), transparent 65%); top: -20vmax; left: -15vmax; animation: drift1 26s var(--ease-io) infinite alternate; }
.blob.b2 { background: radial-gradient(circle, var(--c2), transparent 65%); top: 10vmax; right: -20vmax; animation: drift2 32s var(--ease-io) infinite alternate; }
.blob.b3 { background: radial-gradient(circle, var(--c3), transparent 65%); bottom: -25vmax; left: 20vmax; opacity: .22; animation: drift3 38s var(--ease-io) infinite alternate; }
@keyframes drift1 { to { transform: translate(18vmax, 14vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-22vmax, 10vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(-10vmax, -18vmax) scale(1.2); } }
.grid { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%); }
.cursor-glow { position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
  pointer-events: none; z-index: -1; background: radial-gradient(circle, rgba(34,211,238,.10), rgba(167,139,250,.06) 35%, transparent 65%);
  will-change: transform; opacity: 0; transition: opacity .6s; }
body.has-pointer .cursor-glow { opacity: 1; }

/* ---------- Scroll progress + nav ---------- */
.progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 12px rgba(167,139,250,.7); }
nav.top { position: fixed; top: 14px; left: 50%; z-index: 50; width: min(var(--max), calc(100% - 28px)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 18px; padding: 9px 10px 9px 18px; border-radius: 999px;
  background: rgba(10,12,29,.35); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  transition: background .5s var(--ease-out), box-shadow .5s var(--ease-out); animation: navIn 1s var(--ease-out) both .2s; }
nav.top.scrolled { background: rgba(10,12,29,.72); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
@keyframes navIn { from { opacity: 0; transform: translate(-50%, -20px); } }
.brand { font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; color: #05060f;
  background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 0 18px rgba(34,211,238,.45); }
.nav-links { display: flex; gap: 4px; margin-left: auto; }
.nav-links a { padding: 6px 12px; border-radius: 999px; color: var(--muted); font-size: 13.5px; transition: color .3s, background .3s; }
.nav-links a:hover, .nav-links a.active { color: #fff; background: var(--glass-2); }
.lang { position: relative; display: flex; padding: 3px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--line); }
.lang button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 4px 12px; border-radius: 999px; cursor: pointer; transition: color .35s; }
.lang button[aria-pressed=true] { color: #05060f; }
.lang .pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px;
  background: linear-gradient(135deg, var(--c1), var(--c2)); transition: transform .5s var(--ease-spring); }
.lang[data-lang=en] .pill { transform: translateX(100%); }

/* ---------- Layout ---------- */
main { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; }
section { padding: 110px 0 20px; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--c1); font-size: 12.5px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: linear-gradient(90deg, transparent, var(--c1)); }
h2.title { margin: 10px 0 34px; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; letter-spacing: -.5px; }

/* ---------- Hero ---------- */
.hero { min-height: 100vh; display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; padding-top: 120px; }
.badge { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; border-radius: 999px; font-size: 13px; color: var(--muted);
  background: var(--glass); border: 1px solid var(--line); animation: rise 1s var(--ease-out) both .35s; }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c4); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: ping 2.2s var(--ease-out) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); } 100% { box-shadow: 0 0 0 12px rgba(52,211,153,0); } }
.name { margin: 22px 0 10px; font-size: clamp(56px, 9vw, 112px); line-height: .98; letter-spacing: -2px; font-weight: 800;
  background: linear-gradient(110deg, #fff 0%, #fff 38%, var(--c1) 46%, var(--c2) 52%, var(--c3) 58%, #fff 66%, #fff 100%);
  background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rise 1.2s var(--ease-out) both .45s, shine 7s linear infinite 1.6s; }
html[lang=zh] .name { letter-spacing: 6px; }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -160% 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(36px); filter: blur(12px); } to { opacity: 1; transform: none; filter: none; } }
.role { font-size: clamp(18px, 2.2vw, 24px); color: #cfd5ee; font-weight: 600; animation: rise 1s var(--ease-out) both .6s; }
.typed-line { margin-top: 10px; font-size: clamp(16px, 1.8vw, 20px); color: var(--muted); min-height: 1.7em; animation: rise 1s var(--ease-out) both .75s; }
.typed { background: linear-gradient(90deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 3px; vertical-align: -3px; background: var(--c1); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.intro { max-width: 600px; margin: 22px 0 28px; color: var(--muted); animation: rise 1s var(--ease-out) both .9s; }
.contacts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; animation: rise 1s var(--ease-out) both 1s; }
.ct { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; color: #cfd5ee;
  background: var(--glass); border: 1px solid var(--line); transition: border-color .3s, background .3s, transform .4s var(--ease-spring); }
a.ct:hover { border-color: rgba(34,211,238,.5); background: rgba(34,211,238,.08); transform: translateY(-2px); }
.ct svg { width: 15px; height: 15px; color: var(--c1); flex: none; }
.ctas { display: flex; flex-wrap: wrap; gap: 14px; animation: rise 1s var(--ease-out) both 1.12s; }
.btn { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 13px 24px; border-radius: 999px; font-weight: 700; font-size: 14.5px;
  cursor: pointer; border: 0; font-family: inherit; transition: transform .45s var(--ease-spring), box-shadow .4s; will-change: transform; }
.btn svg { width: 17px; height: 17px; }
.btn.primary { color: #05060f; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 10px 30px rgba(34,211,238,.25); }
.btn.primary:hover { box-shadow: 0 14px 44px rgba(167,139,250,.45); }
.btn.ghost { color: #fff; background: rgba(255,255,255,.03); }
.scroll-hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; color: var(--dim); font-size: 12px;
  letter-spacing: 2px; animation: rise 1s var(--ease-out) both 1.6s; }
.mouse { width: 22px; height: 34px; border: 1.5px solid var(--dim); border-radius: 12px; position: relative; }
.mouse::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 3px; background: var(--c1);
  animation: wheel 1.8s var(--ease-io) infinite; }
@keyframes wheel { 0% { opacity: 0; transform: translateY(-3px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
.hero-wrap { position: relative; }
.hero > * { min-width: 0; }
.code pre { overflow-wrap: anywhere; }
.ct { max-width: 100%; } .ct span { min-width: 0; overflow-wrap: anywhere; }
.intro, .e-lead, ul.b li, .card p { overflow-wrap: anywhere; }

/* Flowing conic border (流光边框) */
.flow { position: relative; isolation: isolate; }
.flow::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; z-index: -1; pointer-events: none;
  background: conic-gradient(from var(--a), rgba(255,255,255,.06) 0deg 220deg, var(--c1) 260deg, var(--c2) 300deg, var(--c3) 330deg, rgba(255,255,255,.06) 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: spin 5s linear infinite; }
.flow.fast::before { animation-duration: 3s; }
@keyframes spin { to { --a: 360deg; } }

/* Code window */
.code { border-radius: var(--radius); background: rgba(10,12,29,.62); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05); animation: floatIn 1.4s var(--ease-out) both .9s; transform-style: preserve-3d; }
@keyframes floatIn { from { opacity: 0; transform: translateY(40px) rotateX(12deg) scale(.96); } }
.code-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12.5px; }
.code-head i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.code-head i:nth-child(1) { background: #ff5f57; } .code-head i:nth-child(2) { background: #febc2e; } .code-head i:nth-child(3) { background: #28c840; }
.code-head span { margin-left: 8px; }
.code pre { margin: 0; padding: 18px 20px 22px; font: 13.2px/1.85 "SF Mono", ui-monospace, Menlo, Consolas, monospace; color: #c7cdea; overflow: hidden; white-space: pre-wrap; }
.code .ln { display: block; opacity: 0; transform: translateX(-8px); animation: lineIn .6s var(--ease-out) forwards; }
@keyframes lineIn { to { opacity: 1; transform: none; } }
.k { color: var(--c2); } .p { color: var(--c1); } .s { color: #fde68a; } .n { color: var(--c3); } .c { color: var(--dim); }

/* ---------- Reveal on scroll ---------- */
[data-reveal] { opacity: 0; transform: translateY(30px) scale(.985); filter: blur(6px);
  transition: opacity .95s var(--ease-out), transform .95s var(--ease-out), filter .95s var(--ease-out);
  transition-delay: calc(var(--d, 0) * 80ms); }
[data-reveal].in { opacity: 1; transform: none; filter: none; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 10px; }
.stat { padding: 22px 22px 20px; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); }
.num { font-size: clamp(34px, 4vw, 46px); font-weight: 800; line-height: 1.05; letter-spacing: -1px; font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, #fff, var(--c1) 70%, var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.num small { font-size: .42em; margin-left: 4px; letter-spacing: 0; }
.stat .lbl { margin-top: 6px; color: var(--muted); font-size: 13.5px; }

/* ---------- Cards with spotlight + tilt ---------- */
.spot { position: relative; overflow: hidden; }
.spot::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0; transition: opacity .5s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(34,211,238,.13), rgba(167,139,250,.06) 35%, transparent 60%); }
.spot:hover::after { opacity: 1; }
.tilt { transition: transform .6s var(--ease-out), border-color .4s; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.card { padding: 24px 26px; border-radius: var(--radius); background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015)); border: 1px solid var(--line); }
.card:hover { border-color: rgba(34,211,238,.28); }
.cards .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
.card-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; font-weight: 800; font-size: 14px; color: #05060f;
  background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 8px 22px rgba(34,211,238,.25); }
.card h3 { margin: 0 0 8px; font-size: 17.5px; color: #fff; }
.card p { margin: 0; color: var(--muted); font-size: 14.2px; }

/* ---------- Timeline ---------- */
.tl { position: relative; padding-left: 42px; }
.tl::before, .tl-fill { content: ""; position: absolute; left: 12px; top: 6px; width: 2px; border-radius: 2px; }
.tl::before { bottom: 6px; background: var(--line); }
.tl-fill { height: 0; background: linear-gradient(180deg, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 14px rgba(34,211,238,.6); }
.tl-item { position: relative; margin-bottom: 22px; padding: 22px 24px; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); }
.tl-item::before { content: ""; position: absolute; left: -37px; top: 28px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg-2);
  border: 2px solid var(--dim); transition: border-color .6s, box-shadow .6s, background .6s; }
.tl-item.lit::before { border-color: var(--c1); background: var(--c1); box-shadow: 0 0 0 5px rgba(34,211,238,.15), 0 0 18px var(--c1); }
.e-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.e-title { font-size: 18px; font-weight: 700; color: #fff; }
.e-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; font-weight: 500; }
.e-date { flex: none; font-size: 12.5px; font-weight: 700; color: var(--c1); padding: 4px 12px; border-radius: 999px; background: rgba(34,211,238,.08);
  border: 1px solid rgba(34,211,238,.25); white-space: nowrap; }
.e-lead { margin: 10px 0 4px; color: #cfd5ee; }
ul.b { margin: 10px 0 0; padding: 0; list-style: none; }
ul.b li { position: relative; padding-left: 20px; margin: 7px 0; color: var(--muted); font-size: 14.4px; }
ul.b li::before { content: ""; position: absolute; left: 2px; top: .72em; width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg);
  background: linear-gradient(135deg, var(--c1), var(--c2)); }
ul.b li ul { margin: 6px 0 0; padding: 0; list-style: none; }
ul.b li ul li::before { background: var(--dim); }

/* ---------- Project cards ---------- */
.projects { display: grid; gap: 20px; }
.projects.two { grid-template-columns: repeat(2, 1fr); }
.proj { padding: 26px 28px; border-radius: var(--radius); background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); border: 1px solid var(--line);
  transition: transform .6s var(--ease-out), border-color .4s; }
.proj:hover { transform: translateY(-4px); border-color: rgba(167,139,250,.35); }
.proj:hover.flow::before { animation-duration: 2.2s; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0 2px; }
.chip { padding: 3px 11px; border-radius: 999px; font-size: 12.5px; color: #d9def4; background: rgba(255,255,255,.04); border: 1px solid var(--line);
  transition: transform .35s var(--ease-spring), border-color .3s, color .3s, box-shadow .3s; }
.chip:hover { transform: translateY(-2px); color: #fff; border-color: rgba(34,211,238,.55); box-shadow: 0 6px 18px rgba(34,211,238,.18); }

/* ---------- Skills ---------- */
.marquee { position: relative; overflow: hidden; margin: 0 0 30px; padding: 6px 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.track { display: flex; gap: 12px; width: max-content; animation: marquee 55s linear infinite; }
.marquee.rev .track { animation-direction: reverse; animation-duration: 65s; }
.marquee:hover .track { animation-play-state: paused; }
.track .chip { font-size: 14px; padding: 7px 16px; white-space: nowrap; }
@keyframes marquee { to { transform: translateX(-50%); } }
.skills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.sk { padding: 18px 20px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); }
.sk h3 { margin: 0 0 4px; font-size: 14.5px; color: #fff; display: flex; align-items: center; gap: 8px; }
.sk h3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 10px var(--c1); }
.sk .chips { margin-top: 8px; }

/* ---------- Education + footer ---------- */
.edu-card { padding: 26px 28px; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); }
.edu-card ul.b li { color: #cfd5ee; }
footer { width: min(var(--max), calc(100% - 40px)); margin: 90px auto 0; padding: 30px 0 46px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
footer a:hover { color: #fff; }
.to-top { position: fixed; right: 22px; bottom: 22px; z-index: 40; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
  background: rgba(10,12,29,.7); color: #fff; display: grid; place-items: center; backdrop-filter: blur(10px);
  opacity: 0; transform: translateY(16px) scale(.8); transition: opacity .5s var(--ease-out), transform .5s var(--ease-spring); }
.to-top.show { opacity: 1; transform: none; }
.to-top svg { width: 18px; height: 18px; }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 110px; }
  .stats { grid-template-columns: repeat(2, 1fr); margin-top: 10px; }
  .projects.two, .skills { grid-template-columns: 1fr; }
  .nav-links { display: none; }
  .lang { margin-left: auto; }
  .scroll-hint { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  main, footer { width: calc(100% - 32px); }
  .cards { grid-template-columns: 1fr; }
  .tl { padding-left: 30px; } .tl::before, .tl-fill { left: 6px; } .tl-item::before { left: -30px; }
  .tl-item, .proj, .card { padding: 20px; }
  section { padding-top: 84px; }
  .brand-text { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  [data-reveal], .code .ln { opacity: 1; transform: none; filter: none; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grid" aria-hidden="true"></div>
<div class="cursor-glow" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"></div>

<nav class="top" aria-label="Main">
  <a class="brand" href="#top"><span class="brand-mark">YZ</span><span class="brand-text" id="brandText"></span></a>
  <div class="nav-links" id="navLinks"></div>
  <div class="lang" id="lang" data-lang="zh" role="group" aria-label="Language">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" data-l="zh" aria-pressed="true">中</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div>
</nav>

n. I led the front-end team at Tuniu and am used to working across regions and teams."}]}, {"id": "experience", "nav": "Experience", "eyebrow": "02 · Experience", "title": "Work Experience", "kind": "timeline", "items": [{"title": "Trend Micro (China)", "sub": "Staff Engineer", "date": "Mar 2019 – Present", "lead": ["I build and maintain the front end of the Trend Vision One unified console (V1 Portal) and its platform apps, used by enterprises and service providers (xSP) worldwide."], "stack": [], "bullets": [{"html": "I drive AI-assisted development in the team. Claude Code is my main tool for delivering features, and I committed shared hooks, skills and coding guidelines for the team. I also brought a console module into the company's internal AI prototyping sandbox.", "sub": []}, {"html": "I built the micro-frontend widget container for the Security Posture dashboard (qiankun) from scratch and still maintain it, with 92 merged pull requests.", "sub": []}, {"html": "I've worked on the console since its Trend Micro XDR days, as it grew into Vision One, with 1,000+ merged pull requests.", "sub": []}, {"html": "I led the front-end build upgrades: vue-cli (webpack) → Vite, on-demand locale bundles, idle-time loading of third-party scripts, and reproducible CI builds.", "sub": []}, {"html": "I built components based on the Tonic One design system, with dark and light themes.", "sub": []}, {"html": "I maintain the Notifications, API Keys, Product Instance, Security Posture, User Roles (RBAC) and Automation Center apps.", "sub": []}]}, {"title": "Tuniu", "sub": "Frontend Architect / R&amp;D Manager (front-end team)", "date": "Apr 2017 – Mar 2019", "lead": [], "stack": [], "bullets": [{"html": "Owned the front-end architecture for back-office systems and mobile sites. Led framework and standard component development, and set front-end coding standards.", "sub": []}, {"html": "Set up an integrated dev environment (scaffolding, automated tests, deployment) and drove adopti function render(lang) {
  const d = DATA[lang];
  document.documentElement.lang = lang;

  const contacts = d.contacts.map(c => {
    const inner = `${svg(c.icon)}<span>${c.text}</span>`;
    return c.url ? `<a class="ct" href="${c.url}" target="_blank" rel="noopener">${inner}</a>` : `<span class="ct">${inner}</span>`;
  }).join('');

  const code = [
    `<span class="k">const</span> <span class="p">${d.ui.codeVar}</span> = {`,
    `  role: <span class="s">'${d.role}'</span>,`,
    `  company: <span class="s">'Trend Micro'</span>,`,
    `  years: <span class="n">18</span>,`,
    `  focus: [`,
    ...d.typed.map((t, i) => `    <span class="s">'${t}'</span>${i < d.typed.length - 1 ? ',' : ''}`),
    `  ],`,
    `  stack: [`,
    ...STACK.map((row, i) => `    ${row.map(t => `<span class="s">'${t}'</span>`).join(', ')}${i < STACK.length - 1 ? ',' : ''}`),
    `  ],`,
    `  aiNative: <span class="n">true</span>, <span class="c">// ${d.ui.codeComment}</span>`,
    `};`
  ].map((l, i) => `<span class="ln" style="animation-delay:${1.3 + i * .09}s">${l}</span>`).join('');

  const stats = d.stats.map((s, i) => `
    <div class="stat spot tilt" data-reveal style="--d:${i}">
      <div class="num" data-count="${s.num}">${s.num}${s.unit ? `<small>${s.unit}</small>` : ''}</div>
      <div class="lbl">${s.label}</div>
    </div>`).join('');

  const html = [`
  <div class="hero-wrap" id="top">
    <section class="hero">
      <div>
        <span class="badge"><span class="dot"></span>${d.ui.badge}</span>
        <h1 class="name">${d.name}</h1>
        <div class="role">${d.role}</div>
        <div class="typed-line">${d.ui.typedPrefix} <span class="typed" id="typed"></span><span class="caret"></span></div>
        <p class="intro">${d.intro}</p>

        <div class="ctas">
          <a class="btn primary magnetic" href="${d.ui.pdf}" target="_blank" rel="noopener">${svg('download')}${d.ui.download}</a>
          <a class="btn ghost flow magnetic" href="#${secs[0].id}">${d.ui.explore}${svg('arrow')}</a>
        </div>
      </div>

        <div class="code-head"><i></i><i></i><i></i><span>${d.ui.codeFile}</span></div>
        <pre>${code}</pre>
      </div>
    </section>
    <div class="scroll-hint" aria-hidden="true"><div class="mouse"></div>${d.ui.scroll}</div>
  </div>
  <div class="stats">${stats}</div>`];

  for (const s of secs) html.push(renderSection(s));
  document.getElementById('app').innerHTML = html.join('');

  document.getElementById('foot').innerHTML = `
    <span>© ${new Date().getFullYear()} ${d.name} · ${d.ui.footer}</span>
    <span>${d.contacts.filter(c => c.url).map(c => `<a href="${c.url}" target="_blank" rel="noopener">${c.text}</a>`).join(' · ')}</span>`;

  wire();
}

function chips(list) { return `<div class="chips">${list.map(c => `<span class="chip">${c}</span>`).join('')}</div>`; }
function bullets(list) {
  if (!list.length) return '';
  return `<ul class="b">${list.map(b => `<li>${b.html}${b.sub && b.sub.length ? `<ul>${b.sub.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</li>`).join('')}</ul>`;
}
function entryHead(e) {
  return `<div class="e-head"><div class="e-title">${e.title}${e.sub ? `<span class="e-sub">${e.sub}</span>` : ''}</div><span class="e-date">${e.date}</span></div>`;
}
function entryBody(e) {
  return e.lead.map(p => `<p class="e-lead">${p}</p>`).join('') + (e.stack.length ? chips(e.stack) : '') + bullets(e.bullets);
}
function head(s) { return `<span class="eyebrow" data-reveal>${s.eyebrow}</span><h2 class="title" data-reveal style="--d:1">${s.title}</h2>`; }

function renderSection(s) {

  } else if (s.kind === 'timeline') {
    body = `<div class="tl"><span class="tl-fill"></span>${s.items.map(e => `

  } else if (s.kind === 'projects') {
    const two = s.items.length === 2 ? ' two' : '';
    body = `<div class="projects${two}">${s.items.map((e, i) => `
      <article class="proj flow spot" data-reveal style="--d:${two ? i : 0}">${entryHead(e)}${entryBody(e)}</article>`).join('')}</div>`;
  } else if (s.kind === 'skills') {
    const all = s.items.flatMap(k => k.chips.map(strip));
    const half = Math.ceil(all.length / 2);
    const row = (arr) => { const c = arr.map(x => `<span class="chip">${x}</span>`).join(''); return `<div class="track">${c}${c}</div>`; };
    body = `
      <div class="marquee" data-reveal aria-hidden="true">${row(all.slice(0, half))}</div>
      <div class="marquee rev" data-reveal style="--d:1" aria-hidden="true">${row(all.slice(half))}</div>
      <div class="skills">${s.items.map((k, i) => `
        <div class="sk spot" data-reveal style="--d:${i % 2}"><h3>${k.label}</h3>${chips(k.chips)}</div>`).join('')}</div>`;
  } else {
    body = `<div class="edu-card spot" data-reveal>${bullets(s.items)}</div>`;
  }
  return `<section id="${s.id}">${head(s)}${body}</section>`;
}

/* ---------- Interactions ---------- */
let typingTimer = null, revealObs = null, navObs = null;

function wire() {
  // Scroll reveal
  revealObs && revealObs.disconnect();
  revealObs = new IntersectionObserver((entries) => {
    for (const en of entries) if (en.isIntersecting) {
      en.target.classList.add('in');
      const n = en.target.querySelector('[data-count]');
      if (n) countUp(n);
      revealObs.unobserve(en.target);
    }
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  document.querySelectorAll('[data-reveal]').forEach(el => revealObs.observe(el));

  // Active nav link
  navObs && navObs.disconnect();
  navObs = new IntersectionObserver((entries) => {
    for (const en of entries) if (en.isIntersecting) {
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.dataset.sec === en.target.id));
    }
  }, { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('main section[id]').forEach(s => navObs.observe(s));

  startTyping();
  onScroll();
}

function countUp(el) {
  const raw = el.dataset.count;                       // e.g. "18", "1,000+", "−47%"
  const m = raw.match(/^([^\d]*)([\d,]+)(.*)$/);
  if (!m || reduceMotion) return;
  const [, pre, digits, post] = m;
  const target = parseInt(digits.replace(/,/g, ''), 10);
  const small = el.querySelector('small');
  const tail = small ? small.outerHTML : '';
  const t0 = performance.now(), dur = 1900;
  const ease = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);   // easeOutExpo
  const fmt = (v) => digits.includes(',') ? v.toLocaleString('en-US') : String(v);
  (function tick(now) {
    const t = Math.min(1, (now - t0) / dur);
    el.innerHTML = `${pre}${fmt(Math.round(target * ease(t)))}${post}${tail}`;
    if (t < 1) requestAnimationFrame(tick);
  })(t0);
}

function startTyping() {
  clearTimeout(typingTimer);
  const el = document.getElementById('typed');
  const words = DATA[document.documentElement.lang].typed;
  if (reduceMotion) { el.textContent = words[0]; return; }
  let w = 0, i = 0, del = false;
  (function step() {
    const word = words[w];
    i += del ? -1 : 1;
    el.textContent = word.slice(0, i);
    let wait = del ? 32 : 75 + Math.random() * 45;
    if (!del && i === word.length) { del = true; wait = 1700; }
    else if (del && i === 0) { del = false; w = (w + 1) % words.length; wait = 380; }
    typingTimer = setTimeout(step, wait);
  })();
}

// Scroll: progress bar, nav state, timeline fill, back-to-top
const progress = document.querySelector('.progress'), nav = document.querySelector('nav.top'), toTop = document.getElementById('toTop');
let ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    progress.style.transform = `scaleX(${max > 0 ? h.scrollTop / max : 0})`;
    nav.classList.toggle('scrolled', h.scrollTop > 30);
    toTop.classList.toggle('show', h.scrollTop > innerHeight * .8);
    document.querySelectorAll('.tl').forEach(tl => {
      const r = tl.getBoundingClientRect(), mid = innerHeight * .62;
      const p = Math.max(0, Math.min(1, (mid - r.top) / r.height));
      tl.querySelector('.tl-fill').style.height = `${p * (r.height - 12)}px`;
      tl.querySelectorAll('.tl-item').forEach(it => it.classList.toggle('lit', it.getBoundingClientRect().top < mid));
    });
    ticking = false;
  });
}
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', onScroll);
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }));

// Pointer effects: cursor glow (lerped), spotlight, tilt, magnetic buttons
const glow = document.querySelector('.cursor-glow');
let gx = innerWidth / 2, gy = innerHeight / 3, tx = gx, ty = gy;
if (matchMedia('(pointer: fine)').matches && !reduceMotion) {
  document.body.classList.add('has-pointer');
  addEventListener('pointermove', (e) => { tx = e.clientX; ty = e.clientY; }, { passive: true });
  (function loop() { gx += (tx - gx) * .12; gy += (ty - gy) * .12; glow.style.transform = `translate(${gx}px, ${gy}px)`; requestAnimationFrame(loop); })();

  document.addEventListener('pointermove', (e) => {
    const spot = e.target.closest('.spot');
    if (spot) {
      const r = spot.getBoundingClientRect();
      spot.style.setProperty('--mx', `${e.clientX - r.left}px`);
      spot.style.setProperty('--my', `${e.clientY - r.top}px`);
      if (spot.classList.contains('tilt')) {
        const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
        spot.style.setProperty('--ry', `${px * 7}deg`); spot.style.setProperty('--rx', `${-py * 7}deg`);
      }
    }
    const mag = e.target.closest('.magnetic');
    if (mag) {
      const r = mag.getBoundingClientRect();
      mag.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .22}px, ${(e.clientY - r.top - r.height / 2) * .32}px)`;
    }
  }, { passive: true });
  document.addEventListener('pointerout', (e) => {
    const t = e.target.closest('.tilt');
    if (t && !t.contains(e.relatedTarget)) { t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); }
    const m = e.target.closest('.magnetic');
    if (m && !m.contains(e.relatedTarget)) m.style.transform = '';
  });
}

// Language toggle
const langBox = document.getElementById('lang');
function setLang(l) {
  langBox.dataset.lang = l;
  langBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
  try { localStorage.setItem('yz_lang', l); } catch (_) {}
  render(l);
}
langBox.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && b.dataset.l !== langBox.dataset.lang) setLang(b.dataset.l); });

let initial = 'zh';
try { initial = localStorage.getItem('yz_lang') || ''; } catch (_) { initial = ''; }
if (!DATA[initial]) initial = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const q = new URLSearchParams(location.search).get('lang');
if (DATA[q]) initial = q;
setLang(initial);
</script>
</body>
